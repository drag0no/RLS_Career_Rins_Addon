<link rel="stylesheet" type="text/css" href="/ui/modModules/freeroamRaceHud/roadAuthorityClear.css" />

<div class="rac-overlay" ng-if="visible">
  <div class="rac-card" bng-blur="true" ng-style="cardStyle()" ng-mousedown="startDrag($event)">
    <div class="rac-accent"></div>
    <div class="rac-head">
      <div class="rac-pre">Skeleton Coast</div>
      <div class="rac-title">{{ payload.title || 'Road Authority' }}</div>
    </div>
    <div class="rac-rows">
      <div class="rac-row">
        <span>Report</span>
        <strong>{{ payload.reportName || 'Cleanup Report' }}</strong>
      </div>
    </div>
    <div class="rac-actions">
      <button type="button" class="rac-btn rac-btn-primary" ng-click="clearDebris()">Clear Debris</button>
      <button type="button" class="rac-btn rac-btn-secondary" ng-click="close()">Close</button>
    </div>
  </div>
</div>
